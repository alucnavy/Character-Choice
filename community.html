<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a12">
<title>Character Choice — Classement communautaire</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Page community — réaménagement premium */
  body{background:linear-gradient(180deg, rgba(3,6,12,0.6), rgba(2,4,10,0.95));}
  .community-wrap{max-width:1200px;margin:36px auto;padding:10px 18px 60px}
  .community-hero{
    display:flex;
    gap:20px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border:1px solid rgba(255,255,255,0.03);
    padding:18px;
    border-radius:14px;
    box-shadow:0 10px 40px rgba(2,4,10,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
  }
  .hero-left{display:flex;gap:14px;align-items:center}
  .hero-mark{width:74px;height:74px;border-radius:14px;display:grid;place-items:center;font-size:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b0910;box-shadow:0 10px 30px rgba(136,98,255,0.12)}
  .hero-copy h1{margin:0;font-size:clamp(20px,3.5vw,30px);letter-spacing:-0.4px}
  .hero-copy p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .controls input[type="search"], .controls select{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    color:#eef0ff;border:1px solid rgba(255,255,255,0.04);
    border-radius:10px;padding:10px 12px;min-width:220px;outline:none;
    transition:box-shadow .18s, transform .12s;
  }
  .controls input[type="search"]:focus, .controls select:focus{box-shadow:0 6px 20px rgba(140,124,255,0.08);transform:translateY(-1px)}
  #status{color:var(--muted);padding:12px 0;margin-top:8px}

  /* Grid of cards */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:18px}
  .stat-card{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border:1px solid rgba(255,255,255,0.03);
    border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;
    box-shadow:0 12px 30px rgba(2,4,10,0.6);
    transition:transform .12s, box-shadow .12s, border-color .12s;
    overflow:hidden;
  }
  .stat-card:hover{
    transform:translateY(-6px);
    box-shadow:0 24px 60px rgba(2,4,10,0.75);
    border-color:rgba(140,124,255,0.18);
  }

  .portrait{
    width:92px;height:116px;border-radius:10px;flex:0 0 92px;background:linear-gradient(180deg,#0b0f1f,#07102a);display:flex;align-items:center;justify-content:center;overflow:hidden;
    border:1px solid rgba(255,255,255,0.03);
  }
  .portrait img{width:100%;height:100%;object-fit:cover;display:block}

  .stat-info{flex:1;min-width:0;display:flex;flex-direction:column}
  .name-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .stat-info .name{font-weight:900;color:#fff;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{color:var(--muted);font-size:13px;margin-top:6px}
  .stat-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .badge{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border:1px solid rgba(255,255,255,0.04);
    padding:6px 10px;border-radius:999px;font-weight:900;color:#fff;font-size:13px;
    display:inline-flex;align-items:center;gap:8px;
  }
  .badge.wins{background:linear-gradient(90deg,#b0f5c9, #7fe6a6);color:#06220f}
  .badge.losses{background:linear-gradient(90deg,#ffd3d9,#ff9aa4);color:#3b0b0f}
  .badge.fights{background:linear-gradient(90deg,#fff6c2,#ffd84a);color:#281b00}
  .badge.rate{background:linear-gradient(90deg,#dbe7ff,#b5c7ff);color:#071033}

  /* subtle rank chip on top-right of card */
  .rank-chip{position:absolute;right:12px;top:12px;padding:6px 10px;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01));color:var(--muted);font-weight:900;font-size:12px;box-shadow:0 8px 20px rgba(2,4,10,0.6)}

  /* responsive */
  @media(max-width:900px){
    .portrait{width:76px;height:96px;flex:0 0 76px}
    .stat-card{padding:12px}
  }
  @media(max-width:560px){
    .community-wrap{padding:8px}
    .community-hero{flex-direction:column;align-items:flex-start;gap:10px}
    .controls input[type="search"]{width:100%}
    .stats-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
    .portrait{width:68px;height:92px;flex-basis:68px}
  }
</style>
</head>
<body>
<div class="site-header">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🌍</div>
      <div class="brand-copy">
        <div class="eyebrow">COMMUNITY STATS</div>
        <h1>Classement communautaire</h1>
      </div>
    </div>
    <div class="actions">
      <a href="index.html" class="secondary nav-link">🏆 Tournoi</a>
      <a href="stats.html" class="secondary nav-link">📊 Statistiques</a>
      <a href="community.html" class="secondary nav-link">🌐 Communauté</a>
    </div>
  </header>
</div>

<main class="community-wrap">
  <div class="community-hero" role="banner" aria-hidden="false">
    <div class="hero-left">
      <div class="hero-mark">🏅</div>
      <div class="hero-copy">
        <h1>Classement communautaire officiel</h1>
        <p>Les statistiques consolidées par la communauté — victoires, défaites et taux de victoire par personnage.</p>
      </div>
    </div>
    <div class="controls" role="search" aria-label="Recherche et tri">
      <input id="search" type="search" placeholder="Rechercher un personnage…" aria-label="Rechercher un personnage">
      <select id="sort" aria-label="Trier par">
        <option value="wins">Victoires (desc)</option>
        <option value="fights">Combats (desc)</option>
        <option value="winRate">Taux de victoire (desc)</option>
        <option value="name">Nom (A→Z)</option>
      </select>
    </div>
  </div>

  <div id="status">Chargement…</div>

  <div id="grid" class="stats-grid" aria-live="polite" aria-busy="true"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="characters.js"></script>

<script>
/* Premium community page — simplified header and refined cards.
   NOTE: This script keeps the same Firestore usage as before and only
   removes the top summary. */
const statusEl = document.getElementById("status");
const gridEl = document.getElementById("grid");
const searchEl = document.getElementById("search");
const sortEl = document.getElementById("sort");

let rows = [];
let mapped = [];

function safeNumber(v){ return Number(v) >= 0 ? Number(v) : 0; }

function getCharacterArray(){
  if (typeof CHARACTERS !== "undefined" && Array.isArray(CHARACTERS)) return CHARACTERS;
  if (window && window.CHARACTERS && Array.isArray(window.CHARACTERS)) return window.CHARACTERS;
  return [];
}

function getCharacterById(id){
  const arr = getCharacterArray();
  return arr.find(c => String(c.id) === String(id));
}

function slugifyForFiles(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/['’]/g,"").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_+|_+$/g,"").toLowerCase();
}

function getImageCandidates(item){
  const id = String(item.id || item.characterId || "");
  const name = String(item.name || item.displayName || "").trim();
  const names = new Set();
  if(name) names.add(name);
  const cleaned = slugifyForFiles(name);
  if(cleaned) names.add(cleaned);
  for(const n of Array.from(names)){
    names.add(n.replace(/_/g,"-"));
    names.add(n.replace(/_/g,""));
  }
  const exts = [".jpg",".jpeg",".png",".webp",".JPG",".JPEG",".PNG",".WEBP"];
  const candidates = [];
  if(id){
    for(const e of exts) candidates.push(`images/${id}${e}`);
  }
  for(const n of Array.from(names)){
    for(const e of exts){
      candidates.push(`images/${id}_${n}${e}`);
      candidates.push(`images/${id}-${n}${e}`);
      candidates.push(`images/${n}${e}`);
    }
  }
  if(id){
    for(const e of exts){
      candidates.push(`images/${id}_portrait${e}`);
      candidates.push(`images/${id}_thumb${e}`);
    }
  }
  return [...new Set(candidates)];
}

function createPortraitElement(item){
  const container = document.createElement("div");
  container.className = "portrait";
  const img = document.createElement("img");
  img.alt = item.displayName || item.name || item.id || "";
  const candidates = getImageCandidates(item);
  let i = 0;
  img.onerror = () => {
    i++;
    if(i < candidates.length) img.src = candidates[i];
    else {
      container.textContent = (item.displayName || item.name || item.id || "").slice(0,1).toUpperCase();
      container.style.fontWeight = "900";
      container.style.color = "#fff";
      container.style.fontSize = "20px";
      container.style.background = "linear-gradient(180deg,#0f1530,#081024)";
    }
  };
  if(candidates.length){
    img.src = candidates[0];
    container.appendChild(img);
  } else {
    container.textContent = (item.displayName || item.name || item.id || "").slice(0,1).toUpperCase();
  }
  return container;
}

function computeDerived(item){
  const wins = Number(item.wins || 0);
  const lossesExists = Object.prototype.hasOwnProperty.call(item, "losses");
  const losses = lossesExists ? Number(item.losses || 0) : null;
  let fights = null;
  if (Object.prototype.hasOwnProperty.call(item, "fights")) fights = Number(item.fights || 0);
  else if (losses !== null) fights = wins + losses;
  else if (wins) fights = wins;
  const winRate = (fights && fights > 0) ? Math.round((wins / fights) * 100) : null;
  return { wins: safeNumber(wins), losses: losses !== null ? Math.max(0, losses) : null, fights: fights !== null ? Math.max(0, fights) : null, winRate };
}

function renderGrid(list){
  gridEl.innerHTML = "";
  if(!list.length){
    gridEl.innerHTML = '<div class="no-stats">Aucun résultat.</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  for(const item of list){
    const card = document.createElement("article");
    card.className = "stat-card";
    // rank chip (win rate or empty)
    if(item.winRate !== null && item.winRate !== undefined){
      const chip = document.createElement("div");
      chip.className = "rank-chip";
      chip.textContent = `${item.winRate}% victoire`;
      card.appendChild(chip);
    }

    const portrait = createPortraitElement(item);
    card.appendChild(portrait);

    const info = document.createElement("div");
    info.className = "stat-info";
    const nameRow = document.createElement("div");
    nameRow.className = "name-row";
    const nameEl = document.createElement("div");
    nameEl.className = "name";
    nameEl.title = item.displayName || item.name || item.id || "";
    nameEl.textContent = item.displayName || item.name || item.id || "";
    nameRow.appendChild(nameEl);
    info.appendChild(nameRow);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = item.universe ? item.universe : (item.media ? item.media : "");
    if(meta.textContent) info.appendChild(meta);

    const statsRow = document.createElement("div");
    statsRow.className = "stat-row";

    const winsBadge = document.createElement("div");
    winsBadge.className = "badge wins";
    winsBadge.textContent = `🏆 ${item.wins}`;
    statsRow.appendChild(winsBadge);

    if (item.losses !== null && item.losses !== undefined) {
      const lossesBadge = document.createElement("div");
      lossesBadge.className = "badge losses";
      lossesBadge.textContent = `💀 ${item.losses}`;
      statsRow.appendChild(lossesBadge);
    }

    if (item.fights !== null && item.fights !== undefined) {
      const fightsBadge = document.createElement("div");
      fightsBadge.className = "badge fights";
      fightsBadge.textContent = `⚔️ ${item.fights}`;
      statsRow.appendChild(fightsBadge);
    }

    if (item.winRate !== null && item.winRate !== undefined) {
      const rateBadge = document.createElement("div");
      rateBadge.className = "badge rate";
      rateBadge.textContent = `${item.winRate}%`;
      statsRow.appendChild(rateBadge);
    }

    info.appendChild(statsRow);
    card.appendChild(info);
    frag.appendChild(card);
  }
  gridEl.appendChild(frag);
}

function sortList(list, key){
  const copy = [...list];
  if(key === "wins") return copy.sort((a,b) => (b.wins||0) - (a.wins||0) || (b.fights||0) - (a.fights||0) || (a.displayName||"").localeCompare(b.displayName||"","fr"));
  if(key === "fights") return copy.sort((a,b) => (b.fights||0) - (a.fights||0) || (b.wins||0) - (a.wins||0) || (a.displayName||"").localeCompare(b.displayName||"","fr"));
  if(key === "winRate") return copy.sort((a,b) => (b.winRate||0) - (a.winRate||0) || (b.wins||0) - (a.wins||0) || (a.displayName||"").localeCompare(b.displayName||"","fr"));
  return copy.sort((a,b)=> (a.displayName||"").localeCompare(b.displayName||"","fr"));
}

function applyFiltersAndRender(){
  const q = (searchEl.value || "").trim().toLowerCase();
  let list = [...mapped];
  if(q){
    list = list.filter(item => (item.displayName||"").toLowerCase().includes(q));
  }
  list = sortList(list, sortEl.value);
  renderGrid(list);
}

/* Load from Firestore */
function loadCommunityStats(){
  if(!window.db){
    statusEl.textContent = "Firebase non disponible.";
    statusEl.className = "danger-box";
    gridEl.setAttribute("aria-busy", "false");
    return;
  }
  statusEl.textContent = "Chargement des statistiques…";
  gridEl.setAttribute("aria-busy", "true");
  window.db.collection("communityCharacterStats").get()
    .then(snapshot => {
      rows = [];
      snapshot.forEach(doc => {
        const data = doc.data() || {};
        const id = String(data.id || doc.id || "");
        rows.push(Object.assign({}, data, { _docId: doc.id, characterId: id }));
      });

      mapped = rows.map(r => {
        const char = getCharacterById(r.characterId);
        const displayName = r.name || (char && char.name) || (r.characterId || "");
        const derived = computeDerived(r);
        return Object.assign({}, {
          _docId: r._docId,
          id: r.characterId,
          displayName,
          universe: (char && char.universe) || r.universe || "",
          media: (char && char.media) || r.media || "",
          wins: derived.wins,
          losses: derived.losses,
          fights: derived.fights,
          winRate: derived.winRate
        }, r);
      });

      mapped = sortList(mapped, sortEl.value);
      statusEl.style.display = "none";
      gridEl.setAttribute("aria-busy", "false");
      applyFiltersAndRender();
    })
    .catch(err => {
      console.error(err);
      statusEl.textContent = "Impossible de charger les statistiques communautaires.";
      statusEl.className = "danger-box";
      gridEl.setAttribute("aria-busy", "false");
    });
}

/* Events */
searchEl.addEventListener("input", () => applyFiltersAndRender());
sortEl.addEventListener("change", () => applyFiltersAndRender());

/* Kick-off */
loadCommunityStats();
</script>
</body>
</html>
