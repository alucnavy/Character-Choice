<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a12">
<title>Character Choice — Statistiques</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="history-page stats-page">
<header class="topbar history-topbar">
  <div class="brand">
    <div class="brand-mark">📊</div>
    <div class="brand-copy">
      <div class="eyebrow">CHARACTER CHOICE • V5</div>
      <h1>Statistiques</h1>
      <p>Victoires et défaites de chaque personnage, conservées entre les tournois.</p>
    </div>
  </div>
  <div class="actions">
    <a href="index.html" class="secondary nav-link">🏆 Tournoi</a>
    <a href="history.html" class="secondary nav-link">📜 Historique</a>
  </div>
</header>

<main class="history-main stats-main">
  <section class="panel stats-detail character-records-panel">
    <div class="stats-records-head">
      <div>
        <div class="panel-title">⚔️ Victoires / défaites par personnage</div>
        <p class="stats-note">Ces statistiques restent enregistrées même lorsque tu démarres un nouveau tournoi.</p>
      </div>
      <button id="resetCharacterStats" class="danger" type="button">🗑️ Réinitialiser les statistiques</button>
    </div>

    <div class="stats-table-wrap">
      <table class="character-stats-table">
        <thead>
          <tr>
            <th>Personnage</th>
            <th>Victoires</th>
            <th>Défaites</th>
          </tr>
        </thead>
        <tbody id="characterStatsBody"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="characters.js"></script>
<script>
const CHARACTER_STATS_KEY = "characterChoiceV35CharacterStats";

function loadCharacterStats() {
  try {
    const raw = JSON.parse(localStorage.getItem(CHARACTER_STATS_KEY) || "{}");
    return raw && typeof raw === "object" && !Array.isArray(raw) ? raw : {};
  } catch (e) {
    return {};
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[char]));
}

function renderCharacterStats() {
  const stats = loadCharacterStats();
  const body = document.getElementById("characterStatsBody");

  const rows = [...CHARACTERS]
    .map(character => {
      const record = stats[String(character.id)] || {};
      return {
        name: character.name,
        wins: Math.max(0, Number(record.wins) || 0),
        losses: Math.max(0, Number(record.losses) || 0)
      };
    })
    .sort((a, b) => b.wins - a.wins || b.losses - a.losses || a.name.localeCompare(b.name, "fr"));

  body.innerHTML = rows.map(row => `
    <tr>
      <td>${escapeHtml(row.name)}</td>
      <td class="wins">${row.wins}</td>
      <td class="losses">${row.losses}</td>
    </tr>
  `).join("");
}

document.getElementById("resetCharacterStats").addEventListener("click", () => {
  const confirmed = confirm("Réinitialiser les victoires et défaites de TOUS les personnages ? Cette action est irréversible.");
  if (!confirmed) return;
  localStorage.removeItem(CHARACTER_STATS_KEY);
  renderCharacterStats();
});

renderCharacterStats();
</script>
</body>
</html>
